camera:
  fov_deg: 65.0
  sensor_width_mm: 36.0
  fx: null
  fy: null
  cx: null
  cy: null

floor:
  ransac_iterations: 300
  inlier_threshold: 0.03
  sample_stride: 4
  max_points: 20000
  min_floor_fraction: 0.02
  seed: 0

scale:
  mode: auto
  reference_class: door
  reference_width_m: null
  room_width_m: null
  room_depth_m: null
  boundary_percentile: 2.0
  room_min_size_m: 1.5
  room_max_size_m: 30.0
  camera_height_range_m: [0.8, 2.5]

lift:
  snap_orientation: true
  rotation_step_deg: 90.0

room:
  boundary_percentile: 2.0
  min_size_m: 1.5
  max_size_m: 30.0
  ensure_contains_furniture: true
  containment_margin_m: 0.05
  containment_max_ratio: 1.75
